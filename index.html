<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<script>
// 홈 화면 앱(PWA): 실제 https 사이트에서만 오프라인 캐시를 켭니다. 자동 테스트 브라우저에서는 끕니다(?sw=1로 강제 가능).
if ('serviceWorker' in navigator && ((location.protocol === 'https:' && !navigator.webdriver) || /[?&]sw=1\b/.test(location.search))) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
<style>
*{box-sizing:border-box}
:root{color-scheme:light;--ink:#36515e;--cream:#fff9e7;--edge:#456476}
body{margin:0;min-height:100dvh;padding:28px 18px 32px;background:radial-gradient(ellipse at 12% 12%,#d7f6ff80 0 7%,transparent 7.3%),radial-gradient(ellipse at 95% 75%,#c1f1ff75 0 13%,transparent 13.3%),linear-gradient(#79d9ec,#43b8dd);color:var(--ink);font:16px/1.6 system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{width:100%;max-width:560px;margin:auto}
header{text-align:center;margin-bottom:22px}
.tag{display:inline-block;padding:5px 12px;border:2px solid var(--edge);border-radius:999px;background:#fff2c1;color:#79603c;font-size:12px;font-weight:800;box-shadow:0 2px 0 #45647630}
h1{font-size:clamp(30px,7.8vw,44px);line-height:1.2;letter-spacing:-.04em;margin:14px 0;color:#fff9e7;-webkit-text-stroke:1px #365d73;text-shadow:0 3px 0 #365d7370;font-weight:900}
header p{margin:0;color:#25546b;font-size:14px;font-weight:600}
.games{margin:22px 0}
article{position:relative;background:var(--cream);border:3px solid var(--edge);border-radius:24px;padding:24px;box-shadow:0 6px 0 #3a718566}
.island{display:grid;place-items:center;width:70px;height:70px;margin:-4px auto 12px;border:3px solid #bc9557;border-radius:20px;background:#ffe4a5;font-size:42px;box-shadow:inset 0 3px 0 #fff4cb}
h2{margin:0;text-align:center;font-size:24px;line-height:1.3;letter-spacing:-.03em;color:#745732}
article p{margin:12px 0 18px;text-align:center;font-size:14px;line-height:1.7;color:#6f715f}
a.play{display:block;min-height:58px;padding:13px 12px;border:3px solid #427a32;border-radius:14px;background:linear-gradient(#a9e66d,#7ed24c);color:#28502b;text-align:center;text-decoration:none;font-size:20px;font-weight:900;box-shadow:0 4px 0 #427a32,inset 0 2px 0 #d8ffa8;transition:transform .12s,box-shadow .12s}
a.play:hover{background:#b6ed7a}a.play:active{transform:translateY(3px);box-shadow:0 1px 0 #427a32}a:focus-visible{outline:3px solid #2685ba;outline-offset:5px}
.qr{margin-top:28px;padding-top:20px;border-top:2px dashed #ddcda9;text-align:center}
.qr b{display:block;font-size:13px;color:#8a784f}
img{display:block;width:168px;height:168px;max-width:100%;margin:12px auto 8px;padding:6px;border:2px solid #dccba9;border-radius:12px;background:#fff}
small{display:block;font-size:12px;color:#8c8065}
footer{padding:0 6px;text-align:center;font-size:12px;line-height:1.8;color:#275a71}
footer b{display:block;font-size:13px;margin-bottom:3px}
@media(min-width:600px){body{padding-top:44px}header p{font-size:16px}article{padding:28px 40px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <div class="tag">낚시 · 마을 성장 · 해적 방어</div>
    <h1>표류 뗏목 마을</h1>
    <p>작은 뗏목에서 시작하는 나만의 바다 마을!</p>
  </header>
  <section class="games" aria-label="게임 시작">
    <article>
      <div class="island" aria-hidden="true">🏝️</div>
      <h2>오늘도 출항 준비!</h2>
      <p>물고기를 팔고 선원을 모아 마을을 키우세요.<br>다섯 번의 해적 습격을 막으면 항로 확보 성공!</p>
      <a class="play" href="raft-village-3d.html">▶ 3D로 출항하기</a>
      <div class="qr">
        <b>다른 기기에서 게임 열기</b>
        <img src="assets/qr-3d.png" alt="3D 게임의 공개 실행 주소 QR코드" width="168" height="168">
        <small>휴대폰 카메라로 스캔하세요</small>
      </div>
    </article>
  </section>
  <footer><b>PC는 WASD·방향키 · 휴대폰은 화면을 끌어서 이동</b>진행 상황은 플레이한 기기와 브라우저에 저장됩니다.</footer>
</main>
</body>
</html>
